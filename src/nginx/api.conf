# DSL: this file is included inside DSM's own server block (web-config, type=dsm),
# so the request keeps the DSM session and stays same-origin for the browser.
# nginx picks the longest matching prefix, which is why this wins over DSM's own
# /webman/ handler for the api/ subtree only.
location ^~ /webman/3rdparty/synology-frp/api/ {
    proxy_pass http://127.0.0.1:9844/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    client_max_body_size 8m;
}
